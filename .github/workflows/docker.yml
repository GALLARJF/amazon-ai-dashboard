name: docker-build
# Verifica que la imagen construye y que el contenedor arranca en modo cloud (sin contratar nada; sin secretos reales).
on:
  push:
    branches: [aht-v100-desarrollo]
    paths: ["amazon-pro-intelligence-v0.6.0-validacion-keepa/**", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t amazon-pro:ci amazon-pro-intelligence-v0.6.0-validacion-keepa
      - name: Arrancar contenedor y comprobar /healthz
        run: |
          docker run -d --name app -p 10000:10000 -e PORT=10000 -e AMAZON_PRO_PUBLIC_HOST=demo.example.com -e AMAZON_PRO_ADMIN_PASSWORD=ci-clave-de-prueba-123 -e AMAZON_PRO_DB=/tmp/ci.db -e AMAZON_PRO_KEEPA_ENABLE=0 amazon-pro:ci
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/h.txt -w '%{http_code}' -H "Host: demo.example.com" http://127.0.0.1:10000/healthz || true)
            if [ "$code" = 200 ]; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "::error::healthz code=$code body=$(head -c 200 /tmp/h.txt) logs=$(docker logs app 2>&1 | tr '\n' '|' | head -c 800)"
            exit 1
          fi
          echo "healthz OK: $(cat /tmp/h.txt)"
          test "$(docker exec app id -u)" = 10001
      - name: Sin Host público el contenedor rechaza peticiones
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:10000/api/me)
          echo "HTTP $code"
          test "$code" != 200

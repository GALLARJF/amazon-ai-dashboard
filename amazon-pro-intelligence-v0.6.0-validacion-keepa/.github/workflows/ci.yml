name: CI
on:
  push:
    branches: [aht-v100-desarrollo, aht-k4-ejecutivo]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Dependencias de navegador (solo pruebas)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: K4 unitarias y API (sin red, sin gasto)
        run: |
          python tests/k4_unit_test.py
          python tests/k4_api_test.py
      - name: K4 interfaz (Chromium)
        run: python tests/ui_k4_test.py
      - name: Regresión K2/K3
        run: |
          python tests/k2_director_test.py
          python tests/k3_segmentacion_test.py
          python tests/ui_k3_test.py
      - name: Seguridad y esquema
        run: |
          python tests/security_test.py
          python tests/schema_test.py
